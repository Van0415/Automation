name: Automation Regression Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'  # 每日半夜 12 點自動定時執行

jobs:
  run-seleniumbase-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pytest in Headless Mode
      run: |
        pytest --headless --html=reports/report.html --self-contained-html

    - name: Upload Test Report Artifact
      if: always()  # 無論成功或失敗都上傳報告
      uses: actions/upload-artifact@v3
      with:
        name: test-html-report
        path: reports/report.html
